name: Benchmark Quality

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark quality gate
        run: python scripts/check_benchmark_quality.py
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: bhoomiai-benchmark-report
          path: artifacts/benchmark
