[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhoomiai"
version = "0.2.0"
description = "Open agriculture technology utilities for secure farm intelligence and reproducible evaluation workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Optficial Labs Pvt Ltd."}]

[project.scripts]
bhoomiai = "src.cli:main"

[tool.setuptools]
packages = ["src"]
